<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>Tetanor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <h1>Tetanor</h1>
      <div id="grid-4x4">
        <!-- Cells for the 4x4 grid will be populated here by JavaScript -->
      </div>
      <div id="number-strip">
        <!-- Cells for the 16-number strip will be populated here by JavaScript -->
      </div>
    </div>

    <script src="./js/data.js"></script>
    <script>
      window.onload = init;

      let model;
      let view;
      let controller;

      function init() {
        model = new Model();
        view = new View();
        controller = new Controller(model, view);

        controller.startGame();
      }
    </script>
    <script src="./js/model.js"></script>
    <script src="./js/view.js"></script>
    <script src="./js/controller.js"></script>
  </body>
</html>
