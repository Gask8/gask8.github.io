<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>Tetanor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <button id="rules-btn">?</button>
      <div id="timer-display">00:00</div>
      <h1>Tetanor</h1>
      <div id="grid-4x4">
        <!-- Cells for the 4x4 grid will be populated here by JavaScript -->
      </div>
      <div id="number-strip">
        <!-- Cells for the 16-number strip will be populated here by JavaScript -->
      </div>
    </div>

    <div id="game-selection-panel" class="hidden">
      <div id="game-selector">
        <button data-game-id="1">Game 1</button>
        <button data-game-id="2">Game 2</button>
        <button data-game-id="3">Game 3</button>
        <button data-game-id="4">Game 4</button>
        <button data-game-id="5">Game 5</button>
        <button data-game-id="6">Game 6</button>
        <button data-game-id="7">Game 7</button>
        <button data-game-id="8">Game 8</button>
      </div>
    </div>
    <button id="show-games-btn">More Boards</button>

    <div id="rules-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="modal-close-btn">&times;</button>
        <h2>Rules</h2>
        <div id="rules-en" class="rules-text"></div>
        <hr />
        <h2>Reglas</h2>
        <div id="rules-es" class="rules-text"></div>
        <h2>Comments</h2>
        <div id="comments-es" class="comments-es-text"></div>
      </div>
    </div>

    <script src="./js/data.js"></script>
    <script>
      window.onload = init;

      let model;
      let view;
      let controller;

      function init() {
        model = new Model();
        view = new View();
        controller = new Controller(model, view);
        controller.init();
      }
    </script>
    <script src="./js/model.js"></script>
    <script src="./js/view.js"></script>
    <script src="./js/controller.js"></script>
  </body>
</html>
